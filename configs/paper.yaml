# Paper trading bot (scripts/paper_bot.py). Public market data only; no keys, no orders.
#
# Every strategy below runs under every variant. Strategies C1-C4, K1, K2 are the frozen
# out-of-sample set from research/oos_plan.md — do not edit them before that week is scored.

markets_to_record: [GLD-USD, NVDA-USD, HYPE-USD, SPY-USD, ETH-USD]

defaults:
  requote_bps: 1.0      # move a quote only when its target drifts this far
  clip_usd: 25          # size of each resting order
  max_pos_usd: 100      # stop quoting the side that would grow inventory past this
  maker_fee_bps: 0      # Arcus base tier
  rtt_ms: 200           # measured round trip from the original host
  daily_stop_usd: 0     # 0 = off
  rate_limit: true      # Arcus per-subaccount action budget; leftover carries day to day
  order_units: 20000    # starting headroom of a fresh subaccount (one subaccount per strategy)
  cancel_units: 40000

strategies:
  - {id: C1, market: GLD-USD,  depth_bps: 2, role: candidate}
  - {id: C2, market: GLD-USD,  depth_bps: 3, role: candidate}
  - {id: C3, market: NVDA-USD, depth_bps: 3, role: candidate}
  - {id: C4, market: HYPE-USD, depth_bps: 5, role: candidate}
  - {id: K1, market: SPY-USD,  depth_bps: 2, role: breakeven reference}
  - {id: K2, market: ETH-USD,  depth_bps: 2, role: negative control (should lose)}

variants:
  frozen: {}                                   # exactly the pre-registered parameters
  guarded: {rtt_ms: 400, daily_stop_usd: 2}    # worst-case latency + $2/day/market loss stop

schedule:
  score_every_min: 30        # re-score the current UTC day this often
  close_after_utc: "00:20"   # then finalize yesterday and compress its raw tape
  keep_parse_cache_days: 2   # delete data/derived/*.npz older than this (rebuildable)
